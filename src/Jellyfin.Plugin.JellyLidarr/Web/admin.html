<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JellyLidarr</title>
<style>.jl-admin{max-width:760px;margin:3rem auto;padding:1rem}.jl-admin fieldset{border:0;padding:0;margin:0 0 2rem}.jl-admin label{display:block;margin:1rem 0 .35rem}.jl-admin input,.jl-admin select{box-sizing:border-box;width:100%;padding:.7rem}.jl-admin button{margin-top:1rem;padding:.7rem 1rem}.jl-admin table{width:100%;border-collapse:collapse}.jl-admin td,.jl-admin th{text-align:left;padding:.55rem;border-bottom:1px solid #6665}.jl-note{opacity:.75}</style></head>
<body><div id="jellylidarr-admin" class="page type-interior jl-admin" data-role="page"><h1>JellyLidarr</h1><p><a is="emby-linkbutton" class="button-link" href="#/configurationpage?name=JellyLidarrPortal">Open Music Requests</a></p><p class="jl-note">The Lidarr API key remains on this server and is never returned to browsers.</p>
<form id="jla-form"><fieldset><legend><h2>Lidarr connection</h2></legend><label for="jla-url">Lidarr URL</label><input id="jla-url" type="url" required placeholder="http://lidarr:8686"><label for="jla-key">API key</label><input id="jla-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep the saved key"><button id="jla-connect" type="button">Test and load options</button></fieldset>
<fieldset><legend><h2>Download defaults</h2></legend><label for="jla-root">Root folder</label><select id="jla-root"></select><label for="jla-quality">Quality profile</label><select id="jla-quality"></select><label for="jla-meta">Metadata profile</label><select id="jla-meta"></select><label for="jla-monitor">Artist monitoring</label><select id="jla-monitor"><option value="all">All albums</option><option value="future">Future albums</option><option value="missing">Missing albums</option><option value="none">None</option></select><label for="jla-poll">Background polling (seconds)</label><input id="jla-poll" type="number" min="15" max="3600"><label for="jla-timeout">Import timeout (hours)</label><input id="jla-timeout" type="number" min="1" max="168"></fieldset>
<fieldset><legend><h2>User permissions</h2></legend><table><thead><tr><th>User</th><th>Role</th></tr></thead><tbody id="jla-users"></tbody></table></fieldset><button type="submit">Save settings</button><p id="jla-status" role="status"></p></form>
<script>(function(){'use strict';const $=id=>document.getElementById(id);let config;const endpoint=p=>ApiClient.getUrl('JellyLidarr/settings'+p);const call=o=>ApiClient.ajax(Object.assign({dataType:'json',contentType:'application/json'},o));function options(id,values,selected){const box=$(id);box.replaceChildren();values.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;o.selected=x.id===selected;box.append(o)})}async function loadOptions(){const data=await call({url:endpoint('/options'),type:'GET'});options('jla-root',data.rootFolders,config.rootFolderId);options('jla-quality',data.qualityProfiles,config.qualityProfileId);options('jla-meta',data.metadataProfiles,config.metadataProfileId)}async function init(){config=await call({url:endpoint(''),type:'GET'});$('jla-url').value=config.lidarrUrl;$('jla-poll').value=config.pollingSeconds;$('jla-timeout').value=config.importTimeoutHours;$('jla-monitor').value=config.monitorMode;const users=await call({url:endpoint('/users'),type:'GET'});users.filter(x=>!x.isAdministrator).forEach(x=>{const tr=document.createElement('tr'),name=document.createElement('td'),cell=document.createElement('td'),select=document.createElement('select');name.textContent=x.name;select.dataset.user=x.id;['Viewer','Requester','TrustedRequester','Approver'].forEach(role=>{const o=document.createElement('option');o.value=role;o.textContent=role.replace(/([A-Z])/g,' $1').trim();o.selected=(config.userRoles[x.id]||'Viewer')===role;select.append(o)});cell.append(select);tr.append(name,cell);$('jla-users').append(tr)});if(config.hasApiKey)await loadOptions()}$('jla-connect').onclick=async()=>{try{await save();await loadOptions();$('jla-status').textContent='Connected to Lidarr.'}catch(e){$('jla-status').textContent=e.message||e}};async function save(){const roles={};document.querySelectorAll('[data-user]').forEach(x=>roles[x.dataset.user]=x.value);const body={lidarrUrl:$('jla-url').value,lidarrApiKey:$('jla-key').value||null,hasApiKey:config.hasApiKey,rootFolderId:+$('jla-root').value||0,qualityProfileId:+$('jla-quality').value||0,metadataProfileId:+$('jla-meta').value||0,monitorMode:$('jla-monitor').value,pollingSeconds:+$('jla-poll').value,importTimeoutHours:+$('jla-timeout').value,userRoles:roles};await call({url:endpoint(''),type:'PUT',data:JSON.stringify(body)});config=Object.assign(config,body);config.hasApiKey=config.hasApiKey||!!body.lidarrApiKey;$('jla-key').value=''}$('jla-form').onsubmit=async e=>{e.preventDefault();try{await save();$('jla-status').textContent='Settings saved.'}catch(err){$('jla-status').textContent=err.message||err}};init().catch(e=>$('jla-status').textContent=e.message||e)}());</script></div></body></html>
