name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and test package
        shell: pwsh
        run: ./build.ps1
      - name: Update catalog checksum
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem artifacts/jellylidarr_*.zip)
          if ($assets.Count -ne 1) { throw "Expected one release archive, found $($assets.Count)." }
          $asset = $assets[0]
          $actual = (Get-FileHash $asset.FullName -Algorithm MD5).Hash
          $manifest = Get-Content manifest.json | ConvertFrom-Json
          $manifest[0].versions[0].checksum = $actual
          $manifest | ConvertTo-Json -Depth 10 | Set-Content manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update catalog checksum for $env:GITHUB_REF_NAME"
          git push origin HEAD:main
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/jellylidarr_*.zip
          generate_release_notes: true
