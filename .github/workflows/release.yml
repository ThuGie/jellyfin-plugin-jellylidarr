name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: jellylidarr-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and test package
        shell: pwsh
        run: ./build.ps1
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/jellylidarr_*.zip
          generate_release_notes: true
      - name: Verify published package and update catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem artifacts/jellylidarr_*.zip)
          if ($assets.Count -ne 1) { throw "Expected one release archive, found $($assets.Count)." }
          $asset = $assets[0]
          $actual = (Get-FileHash $asset.FullName -Algorithm MD5).Hash
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($asset.Name -ne "jellylidarr_$version.zip") { throw 'Tag and package version differ.' }
          $verificationDir = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern $asset.Name --dir $verificationDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify published release.' }
          $downloadHash = (Get-FileHash (Join-Path $verificationDir $asset.Name) -Algorithm MD5).Hash
          if ($downloadHash -ne $actual) { throw 'Published archive checksum mismatch.' }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch catalog branch.' }
          git switch -c catalog-update origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not switch to catalog branch.' }
          $manifest = @(Get-Content manifest.json -Raw | ConvertFrom-Json)
          $entry = [ordered]@{
            version = $version
            changelog = "See release notes for $version."
            targetAbi = '10.11.11.0'
            sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($asset.Name)"
            checksum = $actual
            timestamp = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $manifest[0].versions = @($entry) + @($manifest[0].versions | Where-Object version -ne $version)
          foreach ($item in $manifest[0].versions) {
            if ($item.checksum -notmatch '^[A-Fa-f0-9]{32}$') { throw "Invalid catalog checksum for $($item.version)." }
          }
          ConvertTo-Json -InputObject $manifest -Depth 10 | Set-Content manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update catalog checksum for $env:GITHUB_REF_NAME"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Catalog publication failed.' }
